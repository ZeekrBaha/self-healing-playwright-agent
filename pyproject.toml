[project]
name = "self-healing-playwright-agent"
version = "0.1.0"
description = "LangGraph agent that triages Playwright failures, heals selector drift, and never masks a regression."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
]

[project.optional-dependencies]
# Added incrementally as features land (kept out of the core install until needed).
runtime = ["langgraph", "langfuse", "playwright", "openai", "python-dotenv"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"   # default suite skips live LLM calls (free + deterministic)
markers = [
    "live: hits real OpenAI/DeepSeek APIs (run explicitly: pytest -m live)",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# lambda stubs are idiomatic for injectable LLM fakes in tests
"tests/**" = ["E731"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true   # langfuse/langgraph/playwright/dotenv ship no/partial stubs

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# agent.graph imports memory/tools/sut at import time — all must ship in the wheel.
packages = ["agent", "tools", "memory", "sut"]
