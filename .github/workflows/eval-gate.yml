name: eval-gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Always: lint + types + the free, deterministic unit/integration suite (live deselected).
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Set up Python + venv
        run: |
          uv python install 3.11
          uv venv --python 3.11
      - name: Install (runtime + dev)
        run: uv pip install -e ".[runtime]" pytest ruff mypy
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy agent tools memory sut
      - name: Run suite (skips live LLM tests)
        run: uv run pytest

  # Prompt regression gate: runs when the triage/judge prompts or eval config change.
  promptfoo:
    runs-on: ubuntu-latest
    needs: tests
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect prompt/eval changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            prompts:
              - 'eval/**'
              - 'agent/nodes.py'
              - 'tools/judge_heal.py'
              - 'tools/propose_candidates.py'
      # No silent skip: false-heal safety is central, so BOTH provider secrets are required
      # when prompt/eval files change. Missing either = loud failure, not a skipped gate.
      - name: Require OPENAI_API_KEY when prompts changed
        if: steps.changes.outputs.prompts == 'true' && env.OPENAI_API_KEY == ''
        run: |
          echo "::error::Prompt/eval files changed but OPENAI_API_KEY secret is missing — triage gate cannot run."
          exit 1
      - name: Require DEEPSEEK_API_KEY when prompts changed
        if: steps.changes.outputs.prompts == 'true' && env.DEEPSEEK_API_KEY == ''
        run: |
          echo "::error::Prompt/eval files changed but DEEPSEEK_API_KEY secret is missing — judge/false-heal gate cannot run."
          exit 1
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.prompts == 'true'
        with:
          node-version: '22'
      - name: Triage eval (OpenAI)
        if: steps.changes.outputs.prompts == 'true'
        run: npx -y promptfoo@latest eval -c eval/promptfooconfig.yaml
      - name: Judge / false-heal eval (DeepSeek)
        if: steps.changes.outputs.prompts == 'true'
        run: npx -y promptfoo@latest eval -c eval/promptfooconfig.judge.yaml
      - name: Note
        if: steps.changes.outputs.prompts != 'true'
        run: echo "No prompt/eval changes — eval gate skipped (nothing to regress)."
